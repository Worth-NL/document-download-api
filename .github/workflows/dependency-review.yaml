name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
     - name: 'Checkout Repository'
       uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
     - name: Dependency Review
       uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
       with:
         fail-on-severity: high

  pip-audit-nl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
     - name: 'Checkout Repository'
       uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
     - name: Set up Python
       uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
       with:
         python-version: '3.x'
     - name: Install pip-audit
       run: pip install pip-audit
     - name: Audit NL requirements
       id: audit
       run: |
         set +e
         # Git-pinned deps (e.g. the notifications-utils NL fork) have no PyPI/OSV
         # entry to check and can't coexist with the file's hash-pinned lines in
         # pip's resolver, so they're excluded before pip-audit ever sees the file.
         grep -v '@ git+' requirements_nl.txt > /tmp/requirements_nl_filtered.txt
         grep -v '@ git+' requirements_nl_test.txt > /tmp/requirements_nl_test_filtered.txt
         pip-audit -r /tmp/requirements_nl_filtered.txt -r /tmp/requirements_nl_test_filtered.txt \
           --format=markdown --output=/tmp/pip-audit-raw.md
         exit_code=$?
         {
           echo "_Note: git-pinned dependencies (e.g. the notifications-utils NL fork) aren't on PyPI/OSV and can't be checked here — excluded from this scan._"
           echo
           if [ -s /tmp/pip-audit-raw.md ]; then
             cat /tmp/pip-audit-raw.md
           else
             echo "pip-audit failed to produce a report (exit $exit_code) — check the workflow logs."
           fi
         } > pip-audit-report.md
         echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
     - name: Comment on PR
       uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
       with:
         header: pip-audit (NL requirements)
         path: pip-audit-report.md
     - name: Fail if vulnerabilities found
       if: steps.audit.outputs.exit_code != '0'
       run: exit 1
