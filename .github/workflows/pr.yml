name: PR

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# No workflow-level concurrency: it would cancel a running helm upgrade in `deploy`.
permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.unit-test
      cancel-in-progress: true

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      # Tests run in the Dockerfile_nl test image (built on the production stage), so they use the same
      # Debian libraries as production, e.g. libmagic for file type detection
      - uses: Worth-NL/ci-workflows/.github/actions/docker-test@main
        with:
          image: document-download-api:test

  build:
    if: github.event.pull_request.draft == false
    needs: unit-test
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    uses: Worth-NL/ci-workflows/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/worth-nl/document-download-api

  deploy:
    if: github.event.pull_request.draft == false && github.base_ref == 'develop'
    needs: build
    permissions:
      contents: read
      pull-requests: write
    uses: Worth-NL/ci-workflows/.github/workflows/deploy-test.yml@main
    with:
      tag: ${{ needs.build.outputs.tag }}
      image-keys: |
        apps.documentDownloadApi
      dry-run-hints: |-
        This validates the whole `notifynl-full` release, not just this service, so the fault may be elsewhere in the chart. Most likely causes:
        - A required value is unset. `--reset-then-reuse-values` only carries forward values previously supplied via `--set`/`-f`.
        - `notifynl-full` added a value with no chart default. Seed it once with a manual `helm upgrade --set <key>=<value>`.
      failure-hints: |-
        Check the test env k8s state and logs, and whether the Helm release needs a rollback.

        Most likely causes:
        - The image is not pullable: ghcr.io package visibility, or expired/changed registry credentials.
        - The image starts but never passes its readiness probe (`/services/_status` on port 7001), so the 300s timeout trips.

        Inspect with `kubectl -n <namespace> describe deploy document-download-api` and the pod logs.
    secrets: inherit
