name: PR

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/worth-nl/document-download-api

jobs:
  unit-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          version-file: requirements_nl_test.txt

      - uses: docker/setup-buildx-action@v3

      # Tests run in the Dockerfile_nl test image (built on the production stage), so they use the same
      # Debian libraries as production instead of the runner's, e.g. libmagic for file type detection
      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile_nl
          target: test
          load: true
          tags: document-download-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check superseded_tests_nl.toml
        run: docker run --rm --entrypoint pytest document-download-api:test --collect-only -qq --nl-verify

      - name: Run unit tests
        run: >-
          docker run --name unit-tests -e TZ=Europe/Amsterdam
          --entrypoint pytest document-download-api:test --junitxml=reports/pytest-unit.xml

      - name: Copy test report out of the container
        if: ${{ !cancelled() }}
        run: docker cp unit-tests:/home/vcap/app/reports ./reports

      # dorny/test-reporter, with xfailed and superseded tests counted separately from skipped
      - uses: Worth-NL/ci-workflows/.github/actions/pytest-report@main
        if: ${{ !cancelled() }}

  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    needs: unit-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set tag
        id: set-tag
        run: |
          TAG=$(date +%Y%m%d).${{ github.run_number }}-pr
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile_nl
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.set-tag.outputs.tag }}
          platforms: linux/amd64
          provenance: false
          target: production

    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}

  deploy:
    if: github.event.pull_request.draft == false && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: Test

    permissions:
      contents: read
      pull-requests: write

    env:
      HELM_SET_ARGS: >-
        --set apps.documentDownloadApi.image.tag=${{ needs.build.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Worth-NL/notifynl-charts-private
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
        name: Checkout Worth-NL/notifynl-charts-private

      # K8S_CONFIG is stored base64-encoded (shared with the other submodules'
      # workflows, which still use bwvolleyball/k8s-toolkit and decode it
      # internally). azure/k8s-set-context's `kubeconfig` method expects raw
      # kubeconfig YAML, not base64, so decode it here first.
      - name: Decode kubeconfig
        id: decode-kubeconfig
        run: |
          {
            echo "content<<KUBECONFIG_EOF"
            echo "${{ secrets.K8S_CONFIG }}" | base64 -d
            echo "KUBECONFIG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ steps.decode-kubeconfig.outputs.content }}

      # --reset-then-reuse-values and --rollback-on-failure below are Helm 4
      # flag names; the runner's default Helm 3 would reject both.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2

      # `update` (unlike `build`) fetches any repository listed in
      # notifynl-full's Chart.yaml on its own, so new chart dependencies
      # need no `helm repo add` here. Versions there are pinned exactly, so
      # it resolves the same charts Chart.lock records.
      - name: Helm chart dependency update
        run: helm dependency update
        working-directory: ${{ github.workspace }}/notifynl-full

      # Renders the chart and validates against the live cluster API/CRDs
      # (required/fail template checks included) without persisting anything
      # or scheduling any pods. Uses the exact same flags as the real deploy
      # below so it can't drift out of sync and give a false pass.
      - name: Pre-flight validation (dry-run, no cluster mutation)
        id: helm-dry-run
        run: |
          set -x
          helm upgrade --install notifynl notifynl-full/ \
          -n ${{ vars.NAMESPACE }} \
          --reset-then-reuse-values \
          $HELM_SET_ARGS \
          --rollback-on-failure \
          --dry-run=server \
          > /dev/null

      - name: Deploy new tag
        id: helm-deploy
        run: |
          set -x
          helm upgrade --install notifynl notifynl-full/ \
          -n ${{ vars.NAMESPACE }} \
          --reset-then-reuse-values \
          $HELM_SET_ARGS \
          --rollback-on-failure \
          --timeout 300s

      - name: Comment on PR if deployment fails
        if: failure() && (steps.helm-dry-run.outcome == 'failure' || steps.helm-deploy.outcome == 'failure') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const dryRunFailed = "${{ steps.helm-dry-run.outcome }}" === "failure";
            const body = dryRunFailed
              ? [
                  "⚠️ **Test environment deployment blocked (pre-flight check failed)**",
                  "",
                  "- Environment: `Test`",
                  "- Image tag: `${{ needs.build.outputs.tag }}`",
                  "",
                  "The pre-flight `helm upgrade --dry-run=server` check failed, so the real deploy never ran — **the cluster was not touched**, nothing to clean up.",
                  "",
                  "This validates the whole `notifynl-full` release, not just this service, so the fault may be elsewhere in the chart. Most likely causes:",
                  "- A required value is unset. `--reset-then-reuse-values` only carries forward values previously supplied via `--set`/`-f`, so anything never seeded stays missing.",
                  "- `notifynl-full` added a value with no chart default. Seed it once with a manual `helm upgrade --set <key>=<value>` and later deploys carry it forward automatically."
                ].join("\n")
              : [
                  "❌ **Test environment deployment failed**",
                  "",
                  "- Environment: `Test`",
                  "- Image tag: `${{ needs.build.outputs.tag }}`",
                  "",
                  "The pre-flight check passed, so the chart renders — this failed while rolling out. `--rollback-on-failure` means Helm has **already attempted to roll the release back**; confirm that rollback actually succeeded rather than assuming a clean state.",
                  "",
                  "Most likely causes:",
                  "- The image is not pullable — ghcr.io package visibility, or expired/changed registry credentials.",
                  "- The new image starts but never passes its readiness probe (`/services/_status` on port 7001), so the 300s timeout trips.",
                  "",
                  "Inspect with `kubectl -n <namespace> describe deploy document-download-api` and the pod logs."
                ].join("\n");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })
